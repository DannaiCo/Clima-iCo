<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hora, Fecha y Clima</title>
    <!-- Estilos de texto tomados de index(2): Arial, negrita y su paleta original. -->

    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 897px;
        height: 192px;
        background: #000;
        font-family: Arial, sans-serif;
      }

      #backgroundContainer {
        position: absolute;
        top: 0;
        left: 0;
        width: 897px;
        height: 192px;
        z-index: 0;
        overflow: hidden;
        background: #000;
      }

      .weather-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 897px;
        height: 192px;

        object-fit: cover;

        opacity: 0;

        /*
    Transición muy corta para evitar
    cualquier frame intermedio.
  */
        transition: opacity 0.15s linear;

        pointer-events: none;
      }

      .weather-background.active {
        opacity: 1;
      }

      .container {
        position: relative;
        display: grid;
        width: 897px;
        height: 192px;
        isolation: isolate;
      }

      .grid-item {
        position: absolute;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        overflow: hidden;
        white-space: nowrap;
        text-align: center;
        line-height: 1;
        font-size: var(--font-max);
        z-index: 1;
      }

      /* HORA */
      .time {
        left: 100px;
        top: 0px;
        width: 200px;
        height: 110px;
        --font-max: 70px;
        --font-min: 30px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        color: #ffffff;
      }

      /* DÍA DE LA SEMANA */
      .day {
        left: 70px;
        top: 102px;
        width: 254px;
        height: 34px;
        --font-max: 35px;
        --font-min: 16px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        color: #04308c;
      }

      /* FECHA */
      .date {
        left: 70px;
        top: 134px;
        width: 255px;
        height: 36px;
        --font-max: 35px;
        --font-min: 16px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        color: #04308c;
      }

      .date-pill {
        display: block;
        width: max-content;
        max-width: 100%;
        box-sizing: border-box;
        padding: 0;
        border: 0;
        background: transparent;
      }

      /* TEMPERATURA */
      .weather {
        left: 420px;
        top: 33px;
        width: 176px;
        height: 108px;
        --font-max: 73px;
        --font-min: 35px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        color: #0857d3;
      }

      /* DESCRIPCIÓN */
      .weather-description {
        left: 408px;
        top: 119px;
        width: 200px;
        height: 40px;
        --font-max: 22px;
        --font-min: 8px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        color: #04308c;
        white-space: pre-line;
        line-height: 1.1;
        text-align: center;
      }

      /* ICONO SVG DEL CLIMA: a la derecha de la temperatura */
      .weather-icon-big {
        position: absolute;
        left: 622px;
        top: 37px;
        width: 123px;
        height: 110px;
        object-fit: contain;
        pointer-events: none;
        z-index: 1;
      }

      /* CIUDAD */
      .city {
        left: 420px;
        top: 25px;
        width: 168px;
        height: 32px;
        --font-max: 18px;
        --font-min: 12px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        color: #04308c;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- FONDO: alterna solamente entre día y noche -->
      <div id="backgroundContainer">
        <video id="fondoA" class="weather-background active" autoplay muted loop playsinline preload="auto"></video>

        <video id="fondoB" class="weather-background" muted loop playsinline preload="auto"></video>
      </div>

      <div id="clock" class="time grid-item" data-fit-text></div>
      <div id="weekday" class="day grid-item" data-fit-text></div>
      <div id="date" class="date grid-item" data-fit-text>
        <span id="dateText" class="date-pill"></span>
      </div>
      <div id="city" class="city grid-item" data-fit-text>Bogotá</div>
      <div id="weather" class="weather grid-item" data-fit-text></div>
      <div id="weatherText" class="weather-description grid-item" data-fit-text></div>
      <img id="weatherIconBig" class="weather-icon-big" alt="Icono del clima" hidden />
    </div>

    <script>
      /* =========================================================
         CONFIGURACIÓN DE VIDEOS
         Ambos MP4 deben estar junto a este index.html.
         El clima ya no influye en el fondo.
      ========================================================= */

      const BACKGROUND_DAY = "CLIMATM_DIA.mp4";
      const BACKGROUND_NIGHT = "CLIMATM_NOCHE.mp4";

      /* =========================================================
         ZONAS DE BOGOTÁ
      ========================================================= */

      const WEATHER_ZONES = {
        // Toberín, Calle 146, Alcalá, Prado,
        // Pepe Sierra, Virrey, Calle 85

        troncalnorte: {
          name: "TroncalNorte",
          lat: 4.707654,
          lon: -74.053761
        },

        // Polo, Escuela Militar, Av Boyacá

        troncal80: {
          name: "Troncal80",
          lat: 4.68173,
          lon: -74.077362
        },

        // 7 de Agosto, Ricaurte

        troncalnqs: {
          name: "TroncalNQS",
          lat: 4.630468,
          lon: -74.079911
        },

        // Terreros, San Mateo, León XIII

        troncalautosur: {
          name: "TroncalAutoSur",
          lat: 4.589131,
          lon: -74.199325
        },

        // Restrepo, Universidades

        troncalcaracas: {
          name: "TroncalCaracas",
          lat: 4.596768,
          lon: -74.081567
        },

        // Suba Calle 100, Niza 127

        troncalsuba: {
          name: "TroncalSuba",
          lat: 4.698682,
          lon: -74.069653
        },

        // Zona utilizada como respaldo

        centro: {
          name: "Centro",
          // lat: 4.647669,
          //  lon: -74.105506
          lat: 4.6904,
          lon: -74.050936
        }
      };

      /* =========================================================
         SELECCIÓN DE ZONA DESDE URL
      ========================================================= */

      /*
        Ejemplos:

        index.html?zona=troncalnorte
        index.html?zona=troncal80
        index.html?zona=troncalnqs
        index.html?zona=troncalautosur
        index.html?zona=troncalcaracas
        index.html?zona=troncalsuba

        Si no existe el parámetro, utiliza "centro".
      */

      const params = new URLSearchParams(window.location.search);

      const requestedZone = (params.get("zona") || "centro").toLowerCase();

      const currentZone = WEATHER_ZONES[requestedZone] || WEATHER_ZONES.centro;

      console.log("Zona de clima:", currentZone.name);
      console.log("Latitud:", currentZone.lat);
      console.log("Longitud:", currentZone.lon);

      /* =========================================================
         ESTADO ACTUAL
         El icono utiliza la última condición meteorológica recibida.
         Los fondos dependen exclusivamente de la hora de Bogotá.
      ========================================================= */

      let currentWeatherCondition = "Despejado";
      let hasWeatherData = false;
      let activeBackground = "A";
      let currentBackgroundSrc = "";
      let backgroundChanging = false;

      /* =========================================================
         HORA DE BOGOTÁ
      ========================================================= */

      function getBogotaHour() {
        /*
          Utilizamos explícitamente America/Bogota.

          Así, aunque el reproductor DOOH tenga otra zona
          horaria configurada, Día / Noche seguirá funcionando
          con la hora real de Bogotá.
        */

        const hourString = new Intl.DateTimeFormat("en-US", {
          timeZone: "America/Bogota",
          hour: "2-digit",
          hourCycle: "h23"
        }).format(new Date());

        return parseInt(hourString, 10);
      }

      /* =========================================================
         DÍA / NOCHE
      ========================================================= */

      function isNightTime() {
        const hour = getBogotaHour();

        /*
          NOCHE:
          18:00 → 05:59

          DÍA:
          06:00 → 17:59
        */

        return hour >= 18 || hour < 6;
      }

      /* =========================================================
         AJUSTE AUTOMÁTICO DEL TEXTO A SU CELDA
      ========================================================= */

      const GRID_TEXT_SELECTOR = "[data-fit-text]";

      function textFitsGridCell(element) {
        const content = element.firstElementChild;
        if (content) {
          return content.scrollWidth <= element.clientWidth + 0.5 && content.scrollHeight <= element.clientHeight + 0.5;
        }
        const measure = document.createElement("span");
        const styles = getComputedStyle(element);
        measure.textContent = element.textContent;
        Object.assign(measure.style, {
          position: "absolute",
          visibility: "hidden",
          display: "inline-block",
          whiteSpace: styles.whiteSpace,
          fontFamily: styles.fontFamily,
          fontSize: styles.fontSize,
          fontWeight: styles.fontWeight,
          letterSpacing: styles.letterSpacing,
          lineHeight: styles.lineHeight,
          width: "max-content",
          maxWidth: "none"
        });
        document.body.appendChild(measure);
        const fits =
          measure.getBoundingClientRect().width <= element.clientWidth + 0.5 &&
          measure.getBoundingClientRect().height <= element.clientHeight + 0.5;
        measure.remove();
        return fits;
      }

      function fitTextToGridCell(element) {
        const styles = getComputedStyle(element);
        const maximumSize = parseFloat(styles.getPropertyValue("--font-max"));
        const minimumSize = parseFloat(styles.getPropertyValue("--font-min")) || 8;

        if (!maximumSize || element.clientWidth === 0 || element.clientHeight === 0) {
          return;
        }

        element.style.fontSize = `${maximumSize}px`;

        if (textFitsGridCell(element)) {
          return;
        }

        let lowerSize = Math.min(minimumSize, maximumSize);
        let upperSize = maximumSize;

        for (let attempt = 0; attempt < 12; attempt += 1) {
          const testSize = (lowerSize + upperSize) / 2;

          element.style.fontSize = `${testSize}px`;

          if (textFitsGridCell(element)) {
            lowerSize = testSize;
          } else {
            upperSize = testSize;
          }
        }

        element.style.fontSize = `${Math.floor(lowerSize * 10) / 10}px`;
      }

      function fitAllGridText() {
        document.querySelectorAll(GRID_TEXT_SELECTOR).forEach(fitTextToGridCell);
      }

      /* =========================================================
         RELOJ, DÍA Y FECHA
      ========================================================= */

      const bogotaClock = new Intl.DateTimeFormat("en-GB", {
        timeZone: "America/Bogota",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      });
      const bogotaDate = new Intl.DateTimeFormat("es-CO", {
        timeZone: "America/Bogota",
        weekday: "long",
        day: "numeric",
        month: "long"
      });
      function updateClock() {
        const now = new Date();
        document.getElementById("clock").textContent = bogotaClock.format(now);
        const parts = bogotaDate.formatToParts(now);
        const part = (type) => parts.find((p) => p.type === type)?.value || "";
        const capitalize = (value) => value.charAt(0).toUpperCase() + value.slice(1);
        document.getElementById("weekday").textContent = capitalize(part("weekday"));
        document.getElementById("dateText").textContent = `${part("day")} de ${capitalize(part("month"))}`;
        requestAnimationFrame(fitAllGridText);
      }

      /* =========================================================
         DETERMINAR TIPO DE CLIMA
      ========================================================= */

      function getWeatherCondition(weatherId, description = "") {
        const id = Number(weatherId);
        if (id >= 200 && id < 300) return "Tormenta";
        if (id >= 300 && id < 400) return "Lluvia_Suave";
        if ([500, 520].includes(id)) return "Lluvia_Ligera";
        if (id >= 501 && id < 600) return "Lluvia_Fuerte";
        if (id === 800) return "Despejado";
        if ([801, 802].includes(id)) return "Parcialmente_Nublado";
        if (id === 803) return "Mayormente_Nublado";
        if (id === 804) return "Nublado";
        if (id >= 700 && id < 800) return "Neblina";
        return "Nublado";
      }

      /* =========================================================
         ICONO SVG SEGÚN EL CLIMA Y EL MOMENTO DEL DÍA
         Se conservan los nombres de los SVG de index(2).
      ========================================================= */

      function getWeatherIcon(condition) {
        const night = isNightTime();

        const icons = {
          Despejado: ["Iconos/Soleado.svg", "Iconos/Despejado_Noche.svg"],
          Parcialmente_Nublado: ["Iconos/Parcialmente_Nublado.svg", "Iconos/Parcialmente_Nublado_Noche.svg"],
          Mayormente_Nublado: ["Iconos/Nublado.svg", "Iconos/Nublado.svg"],
          Nublado: ["Iconos/Nublado.svg", "Iconos/Nublado.svg"],
          Neblina: ["Iconos/Vientos_fuertes.svg", "Iconos/Vientos_fuertes.svg"],
          Lluvia_Suave: ["Iconos/Lluvia_Suave.svg", "Iconos/Lluvia_Suave.svg"],
          Lluvia_Ligera: ["Iconos/Lluvia_Suave.svg", "Iconos/Lluvia_Suave.svg"],
          Lluvia_Fuerte: ["Iconos/Lluvia_Fuerte.svg", "Iconos/Lluvia_Fuerte.svg"],
          Tormenta: ["Iconos/Tormenta.svg", "Iconos/Tormenta.svg"]
        };

        const pair = icons[condition] || icons.Despejado;
        return pair[night ? 1 : 0];
      }

      function updateWeatherIcon() {
        if (!hasWeatherData) return;

        const icon = document.getElementById("weatherIconBig");
        const newSrc = getWeatherIcon(currentWeatherCondition);
        if (icon.getAttribute("src") !== newSrc) {
          icon.src = newSrc;
        }
        icon.hidden = false;
      }

      /* =========================================================
         FONDO: SOLO DÍA / NOCHE
      ========================================================= */

      function getDayNightBackground() {
        return isNightTime() ? BACKGROUND_NIGHT : BACKGROUND_DAY;
      }

      function initializeBackground() {
        const video = document.getElementById("fondoA");
        currentBackgroundSrc = getDayNightBackground();
        video.src = currentBackgroundSrc;
        video.load();
        const playback = video.play();
        if (playback && typeof playback.catch === "function") {
          playback.catch((error) => console.warn("El reproductor no inició el video:", error));
        }
      }

      /* =========================================================
         ACTUALIZAR FONDO
      ========================================================= */
      function waitForVideo(video) {
        return new Promise((resolve, reject) => {
          /*
        readyState >= 2 significa
        HAVE_CURRENT_DATA.

        Es decir:
        ya tenemos un frame disponible.
      */

          if (video.readyState >= 2) {
            resolve();

            return;
          }

          const handleLoaded = () => {
            cleanup();

            resolve();
          };

          const handleError = () => {
            cleanup();

            reject(new Error("No se pudo cargar el video: " + video.src));
          };

          const cleanup = () => {
            video.removeEventListener("loadeddata", handleLoaded);

            video.removeEventListener("error", handleError);
          };

          video.addEventListener("loadeddata", handleLoaded, { once: true });

          video.addEventListener("error", handleError, { once: true });
        });
      }

      async function updateDayNightBackground() {
        const newSrc = getDayNightBackground();

        /*
    Si ya tenemos ese mismo fondo,
    no hacemos absolutamente nada.
  */

        if (newSrc === currentBackgroundSrc) {
          return;
        }

        /*
    Evitamos cambios simultáneos.
  */

        if (backgroundChanging) {
          return;
        }

        backgroundChanging = true;

        /*
    Determinamos cuál video está visible
    y cuál utilizaremos para precargar.
  */

        const activeVideo =
          activeBackground === "A" ? document.getElementById("fondoA") : document.getElementById("fondoB");

        const preloadVideo =
          activeBackground === "A" ? document.getElementById("fondoB") : document.getElementById("fondoA");

        try {
          console.log("Precargando nuevo fondo:", newSrc);

          /*
      Primero dejamos totalmente oculto
      el video que servirá como buffer.
    */

          preloadVideo.classList.remove("active");

          /*
      Asignamos el nuevo archivo.
    */

          preloadVideo.src = newSrc;

          /*
      Pedimos al navegador que comience
      a cargarlo.
    */

          preloadVideo.load();

          /*
      ESPERAMOS hasta que el navegador
      tenga un frame disponible.

      loadeddata significa que ya puede
      pintar el primer frame.
    */

          await waitForVideo(preloadVideo);

          /*
      Lo llevamos al inicio.
    */

          preloadVideo.currentTime = 0;

          /*
      Comenzamos a reproducirlo ANTES
      de hacerlo visible.
    */

          await preloadVideo.play();

          /*
      Esperamos un frame del navegador.

      Así evitamos mostrar el elemento
      antes de que realmente haya pintado
      el video.
    */

          await new Promise((resolve) => {
            requestAnimationFrame(() => {
              requestAnimationFrame(resolve);
            });
          });

          /*
      AHORA sí hacemos visible
      el nuevo fondo.
    */

          preloadVideo.classList.add("active");

          /*
      Quitamos el anterior.

      Como el nuevo ya está reproduciéndose,
      nunca aparece el fondo vacío.
    */

          activeVideo.classList.remove("active");

          /*
      Actualizamos variables.
    */

          activeBackground = activeBackground === "A" ? "B" : "A";

          currentBackgroundSrc = newSrc;

          /*
      Esperamos a que termine
      la pequeña transición.
    */

          setTimeout(() => {
            activeVideo.pause();

            /*
        Opcionalmente lo dejamos vacío
        para liberar memoria.
      */

            activeVideo.removeAttribute("src");

            activeVideo.load();
          }, 300);

          console.log("Fondo cambiado correctamente:", newSrc);
        } catch (error) {
          console.error("Error cambiando fondo:", error);
        } finally {
          backgroundChanging = false;
        }
      }
      /* =========================================================
         ACTUALIZAR VISUALES
         El clima afecta al texto y al SVG, NO al video de fondo.
      ========================================================= */

      function updateWeatherVisuals() {
        updateWeatherIcon();
      }

      /* =========================================================
         CLIMA API
      ========================================================= */

      async function fetchWeather() {
        const apiKey = "65fd2c24a1679d15f7b59502783522f7";

        const lat = currentZone.lat;

        const lon = currentZone.lon;

        const url =
          `https://api.openweathermap.org/data/2.5/weather` +
          `?lat=${lat}` +
          `&lon=${lon}` +
          `&appid=${apiKey}` +
          `&units=metric` +
          `&lang=es`;

        try {
          const response = await fetch(url);

          if (!response.ok) {
            throw new Error(`Error OpenWeather: ${response.status}`);
          }

          const data = await response.json();

          if (data.weather && data.weather.length > 0 && data.main) {
            /* TEMPERATURA */

            const temperature = Math.round(data.main.temp);

            /* DATOS OPENWEATHER */

            const weatherId = data.weather[0].id;

            const description = data.weather[0].description;

            /*
              Convertimos la condición de OpenWeather
              a una de nuestras 6 categorías gráficas.
            */

            currentWeatherCondition = getWeatherCondition(weatherId, description);
            hasWeatherData = true;

            /* TEMPERATURA */

            document.getElementById("weather").textContent = `${temperature}°C`;

            /* DESCRIPCIÓN */

            const WEATHER_LABELS = {
              Despejado: "Soleado",
              Parcialmente_Nublado: "Parcialmente\nnublado",
              Mayormente_Nublado: "Mayormente\nnublado",
              Nublado: "Nublado",
              Neblina: "Neblina",
              Lluvia_Suave: "Llovizna",
              Lluvia_Ligera: "Lluvia ligera",
              Lluvia_Fuerte: "Lluvia",
              Tormenta: "Tormenta"
            };

            document.getElementById("weatherText").textContent = WEATHER_LABELS[currentWeatherCondition] || "Soleado";

            /* CIUDAD */

            document.getElementById("city").textContent = "Bogotá";

            /* ICONO SVG: el fondo no cambia con el clima */

            updateWeatherVisuals();

            requestAnimationFrame(fitAllGridText);

            console.log("CLIMA OPENWEATHER:", {
              codigo: data.weather[0].id,
              descripcionOriginal: data.weather[0].description,
              condicionPantalla: currentWeatherCondition,
              nubosidad: data.clouds?.all,
              lluviaUltimaHora: data.rain?.["1h"] ?? 0,
              temperatura: data.main.temp
            });

            console.log(`Clima actualizado - Bogotá ${currentZone.name}`, {
              temperatura: temperature,
              descripcion: description,
              weatherId: weatherId,
              condicionVisual: currentWeatherCondition,
              periodo: isNightTime() ? "Noche" : "Día",
              latitud: lat,
              longitud: lon
            });
          }
        } catch (error) {
          console.error("Error obteniendo el clima:", error);
          hasWeatherData = false;

          document.getElementById("weather").textContent = "--";

          document.getElementById("weatherText").textContent = "";
          document.getElementById("weatherIconBig").hidden = true;

          requestAnimationFrame(fitAllGridText);
        }
      }

      /* =========================================================
         REVISAR CAMBIO DÍA / NOCHE
      ========================================================= */

      function checkDayNightChange() {
        /*
          Se ejecuta cada minuto.

          Si llega exactamente la transición:

          17:59 → 18:00
          o
          05:59 → 06:00

          se actualizan el video de fondo y el icono SVG,
          sin esperar la siguiente consulta meteorológica.
        */

        updateDayNightBackground();
        updateWeatherIcon();
      }

      /* =========================================================
         INICIALIZACIÓN
      ========================================================= */

      initializeBackground();

      updateClock();

      fitAllGridText();

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(fitAllGridText);
      }

      window.addEventListener("resize", fitAllGridText);

      if ("ResizeObserver" in window) {
        const gridResizeObserver = new ResizeObserver(fitAllGridText);

        gridResizeObserver.observe(document.querySelector(".container"));
      }

      setInterval(updateClock, 1000);

      /*
        Primera carga meteorológica.
      */

      fetchWeather();

      /*
        Actualización API cada 10 minutos.
      */

      setInterval(fetchWeather, 10 * 60 * 1000);

      /*
        Comprobación Día / Noche cada minuto.
      */

      setInterval(checkDayNightChange, 60 * 1000);
    </script>
  </body>
</html>
