<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hora, Fecha y Clima</title>

    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 769px;
        height: 192px;
        background: #000;
        font-family: Arial, sans-serif;
        font-weight: 700;
      }

      #backgroundContainer {
        position: absolute;
        top: 0;
        left: 0;
        width: 769px;
        height: 192px;
        z-index: 0;
        overflow: hidden;
        background: #000;
      }

      .weather-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 769px;
        height: 192px;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.15s linear;
        pointer-events: none;
      }

      .weather-background.active {
        opacity: 1;
      }

      .container {
        position: relative;
        display: grid;
        width: 769px;
        height: 192px;
        overflow: hidden;
      }

      .grid-item {
        position: absolute;
        z-index: 1;
        display: grid;
        place-items: center;
        box-sizing: border-box;
        overflow: hidden;
        white-space: nowrap;
        text-align: center;
        line-height: 1;
        font-size: var(--font-max);
        font-family: Arial, sans-serif;
        font-weight: bold;
        font-style: normal;
      }

      /* Las coordenadas, las dimensiones y los tamaños máximos
         corresponden exactamente a las áreas del HTML recibido. */

      /* HORA */
      .time {
        left: 84px;
        top: 3px;
        width: 175px;
        height: 110px;
        --font-max: 90px;
        --font-min: 30px;
        letter-spacing: 0px;
        color: #ffffff;
      }

      /* DÍA DE LA SEMANA */
      .day {
        left: 61px;
        top: 91px;
        width: 219px;
        height: 42px;
        --font-max: 50px;
        --font-min: 16px;
        color: #04308c;
      }

      /* FECHA */
      .date {
        left: 46px;
        top: 130px;
        width: 274px;
        height: 46px;
        --font-max: 43px;
        --font-min: 16px;
        color: #04308c;
      }

      .date-pill {
        display: block;
        width: max-content;
        max-width: 100%;
        box-sizing: border-box;
        /* Sin cápsula ni fondo: se conserva el span y el área original. */
      }

      /* TEMPERATURA */
      .weather {
        left: 370px;
        top: 42px;
        width: 152px;
        height: 100px;
        --font-max: 75px;
        --font-min: 25px;
        color: #0857d3;
      }

      /* DESCRIPCIÓN */
      .weather-description {
        left: 360px;
        top: 115px;
        width: 169px;
        height: 38px;
        --font-max: 23px;
        --font-min: 10px;
        color: #04308c;
        white-space: pre-line;
        line-height: 0.84;
        text-align: center;
      }

      /* CIUDAD */
      .city {
        left: 360px;
        top: 32px;
        width: 170px;
        height: 32px;
        --font-max: 22px;
        --font-min: 12px;
        color: #04308c;
      }

      /* NUEVO ÍCONO: espacio libre, sin desplazar elementos existentes. */
      .weather-icon-big {
        position: absolute;
        z-index: 1;
        left: 535px;
        top: 48px;
        width: 95px;
        height: 95px;
        object-fit: contain;
        pointer-events: none;
        visibility: hidden;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Videos precargados: se muestran solo por hora de Bogotá. -->
      <div id="backgroundContainer">
        <video id="fondoA" class="weather-background" muted loop playsinline preload="auto"></video>
        <video id="fondoB" class="weather-background" muted loop playsinline preload="auto"></video>
      </div>

      <div id="clock" class="time grid-item" data-fit-text></div>
      <div id="weekday" class="day grid-item" data-fit-text></div>
      <div id="date" class="date grid-item" data-fit-text>
        <span id="dateText" class="date-pill"></span>
      </div>
      <div id="city" class="city grid-item" data-fit-text>Bogotá</div>
      <div id="weather" class="weather grid-item" data-fit-text></div>
      <div id="weatherText" class="weather-description grid-item" data-fit-text></div>
      <img id="weatherIconBig" class="weather-icon-big" alt="Estado del clima" />
    </div>

    <script>
      "use strict";

      const BOGOTA_TIMEZONE = "America/Bogota";
      const BACKGROUND_FILES = {
        Dia: "CLIMATM_DIA.mp4",
        Noche: "CLIMATM_NOCHE.mp4"
      };

      /* Se conservan las zonas y sus coordenadas originales. */
      const WEATHER_ZONES = {
        GeneralSantander: {
          name: "GeneralSantander",
          lat: 4.59357,
          lon: -74.129663
        },
        centro: {
          name: "Centro",
          lat: 4.59357,
          lon: -74.129663
        }
      };

      /* Ejemplos: index.html?zona=GeneralSantander / ?zona=centro
         Comparación sin distinguir mayúsculas y minúsculas. */
      const params = new URLSearchParams(window.location.search);
      const requestedZone = (params.get("zona") || "centro").toLowerCase();
      const currentZone =
        Object.entries(WEATHER_ZONES).find(([key]) => key.toLowerCase() === requestedZone)?.[1] || WEATHER_ZONES.centro;

      const bogotaFormatter = new Intl.DateTimeFormat("es-CO", {
        timeZone: BOGOTA_TIMEZONE,
        weekday: "long",
        day: "numeric",
        month: "long",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      });

      function getBogotaParts() {
        return Object.fromEntries(
          bogotaFormatter
            .formatToParts(new Date())
            .filter((part) => part.type !== "literal")
            .map((part) => [part.type, part.value])
        );
      }

      function isNightTime() {
        const hour = Number(getBogotaParts().hour);
        return hour >= 18 || hour < 6;
      }

      function currentPeriod() {
        return isNightTime() ? "Noche" : "Dia";
      }

      /* Ajuste de fuente que mide los glifos reales, incluidos saltos
         de línea; jamás cambia tamaño o posición de un contenedor. */
      const GRID_TEXT_SELECTOR = "[data-fit-text]";

      function textFitsGridCell(element) {
        const cell = element.getBoundingClientRect();
        const range = document.createRange();
        range.selectNodeContents(element);
        const rectangles = Array.from(range.getClientRects());
        return rectangles.every(
          (rect) =>
            rect.left >= cell.left - 0.5 &&
            rect.right <= cell.right + 0.5 &&
            rect.top >= cell.top - 0.5 &&
            rect.bottom <= cell.bottom + 0.5
        );
      }

      function fitTextToGridCell(element) {
        if (!element.clientWidth || !element.clientHeight) return;
        const style = getComputedStyle(element);
        const max = parseFloat(style.getPropertyValue("--font-max"));
        const preferredMin = parseFloat(style.getPropertyValue("--font-min")) || 8;
        if (!max) return;

        element.style.fontSize = `${max}px`;
        if (textFitsGridCell(element)) return;

        let low = preferredMin;
        element.style.fontSize = `${low}px`;
        // Tamaño mínimo flexible si un texto excepcional aún no cabe.
        if (!textFitsGridCell(element)) low = 8;
        let high = max;

        for (let i = 0; i < 14; i += 1) {
          const mid = (low + high) / 2;
          element.style.fontSize = `${mid}px`;
          if (textFitsGridCell(element)) low = mid;
          else high = mid;
        }
        element.style.fontSize = `${Math.floor(low * 10) / 10}px`;
      }

      function fitAllGridText() {
        document.querySelectorAll(GRID_TEXT_SELECTOR).forEach(fitTextToGridCell);
        // En dos líneas la descripción invade visualmente la zona inferior
        // de los grados si estos se imprimen al máximo permitido.
        // Reducimos solo la fuente, sin mover ni redimensionar las celdas.
        const description = document.getElementById("weatherText");
        if (description.textContent.includes("\n")) {
          const temperature = document.getElementById("weather");
          const fitted = parseFloat(temperature.style.fontSize);
          if (fitted > 62) temperature.style.fontSize = "62px";
        }
      }

      function capitalized(value) {
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function updateClock() {
        const parts = getBogotaParts();
        document.getElementById("clock").textContent = `${parts.hour}:${parts.minute}`;
        document.getElementById("weekday").textContent = capitalized(parts.weekday);
        document.getElementById("dateText").textContent = `${Number(parts.day)} de ${capitalized(parts.month)}`;
        requestAnimationFrame(fitAllGridText);
      }

      /* Clasificación por códigos OpenWeather; la descripción solo
         complementa los identificadores de lluvia. */
      function getWeatherCondition(weatherId, description = "") {
        const id = Number(weatherId);
        if (id >= 200 && id < 300) return "Tormenta";
        if (id >= 300 && id < 400) return "Lluvia_Suave";
        if ([500, 520].includes(id)) return "Lluvia_Ligera";
        if (id >= 501 && id < 600) return "Lluvia_Fuerte";
        if (id === 800) return "Despejado";
        if ([801, 802].includes(id)) return "Parcialmente_Nublado";
        if (id === 803) return "Mayormente_Nublado";
        if (id === 804) return "Nublado";
        if (id >= 700 && id < 800) return "Neblina";
        return "Nublado";
      }

      /* Nombres y rutas obtenidos de index(2).html.
         Para los estados sin variante nocturna se usa el mismo SVG. */
      const WEATHER_ICON_FILES = {
        Despejado: {
          Dia: "Iconos/Soleado.svg",
          Noche: "Iconos/Despejado_Noche.svg"
        },
        Parcialmente_Nublado: {
          Dia: "Iconos/Parcialmente_Nublado.svg",
          Noche: "Iconos/Parcialmente_Nublado_Noche.svg"
        },
        Mayormente_Nublado: {
          Dia: "Iconos/Nublado.svg",
          Noche: "Iconos/Nublado.svg"
        },
        Neblina: {
          Dia: "Iconos/Vientos_fuertes.svg",
          Noche: "Iconos/Vientos_fuertes.svg"
        },
        Lluvia_Ligera: {
          Dia: "Iconos/Lluvia_Suave.svg",
          Noche: "Iconos/Lluvia_Suave.svg"
        },
        Nublado: {
          Dia: "Iconos/Nublado.svg",
          Noche: "Iconos/Nublado.svg"
        },
        Lluvia_Suave: {
          Dia: "Iconos/Lluvia_Suave.svg",
          Noche: "Iconos/Lluvia_Suave.svg"
        },
        Lluvia_Fuerte: {
          Dia: "Iconos/Lluvia_Fuerte.svg",
          Noche: "Iconos/Lluvia_Fuerte.svg"
        },
        Tormenta: {
          Dia: "Iconos/Tormenta.svg",
          Noche: "Iconos/Tormenta.svg"
        }
      };

      const WEATHER_LABELS = {
        Despejado: "Soleado",
        Parcialmente_Nublado: "Parcialmente\nnublado",
        Mayormente_Nublado: "Mayormente\nnublado",
        Nublado: "Nublado",
        Neblina: "Neblina",
        Lluvia_Suave: "Llovizna",
        Lluvia_Ligera: "Lluvia ligera",
        Lluvia_Fuerte: "Lluvia",
        Tormenta: "Tormenta"
      };

      let currentWeatherCondition = "Despejado";

      function updateWeatherIcon() {
        const period = currentPeriod();
        const icon = document.getElementById("weatherIconBig");
        const newPath = WEATHER_ICON_FILES[currentWeatherCondition][period];
        if (icon.getAttribute("src") !== newPath) icon.setAttribute("src", newPath);
        const label =
          currentWeatherCondition === "Despejado" && period === "Noche"
            ? "Despejado"
            : WEATHER_LABELS[currentWeatherCondition];
        document.getElementById("weatherText").textContent = label;
        requestAnimationFrame(fitAllGridText);
      }

      /* Dos reproductores persistentes: un archivo por periodo.
         Se cargan una sola vez y se conserva el último fotograma visible
         hasta tener el siguiente video reproduciéndose. */
      const videos = {
        Dia: document.getElementById("fondoA"),
        Noche: document.getElementById("fondoB")
      };
      let activePeriod = null;
      let backgroundChanging = false;

      function waitForVideo(video) {
        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) return Promise.resolve();
        return new Promise((resolve, reject) => {
          function finish(error) {
            video.removeEventListener("loadeddata", onLoaded);
            video.removeEventListener("error", onError);
            error ? reject(error) : resolve();
          }
          function onLoaded() {
            finish();
          }
          function onError() {
            finish(new Error(`No se pudo cargar el archivo: ${video.getAttribute("src")}`));
          }
          video.addEventListener("loadeddata", onLoaded);
          video.addEventListener("error", onError);
          if (video.error) onError();
        });
      }

      function waitForPaintedFrame(video) {
        return new Promise((resolve) => {
          if (typeof video.requestVideoFrameCallback === "function") {
            video.requestVideoFrameCallback(() => resolve());
          } else {
            requestAnimationFrame(() => requestAnimationFrame(resolve));
          }
        });
      }

      async function updateWeatherBackground() {
        const desiredPeriod = currentPeriod();
        if (activePeriod === desiredPeriod || backgroundChanging) return;
        backgroundChanging = true;

        const nextVideo = videos[desiredPeriod];
        const previousPeriod = activePeriod;
        const previousVideo = previousPeriod ? videos[previousPeriod] : null;
        try {
          await waitForVideo(nextVideo);
          await nextVideo.play();
          await waitForPaintedFrame(nextVideo);
          nextVideo.classList.add("active");
          if (previousVideo) {
            previousVideo.classList.remove("active");
            setTimeout(() => {
              if (activePeriod !== previousPeriod) previousVideo.pause();
            }, 200);
          }
          activePeriod = desiredPeriod;
        } catch (error) {
          // Ante un error se mantiene el último fondo visible.
          console.error("Error en el cambio de fondo:", error);
        } finally {
          backgroundChanging = false;
          // Si hay un error de lectura no se inicia un ciclo de reintentos:
          // el próximo chequeo de minuto puede volver a intentarlo.
        }
      }

      function initializeBackgroundVideos() {
        Object.entries(videos).forEach(([period, video]) => {
          video.src = BACKGROUND_FILES[period];
          video.load();
        });
        updateWeatherBackground();
      }

      /* OpenWeather conserva el API key y las coordenadas existentes. */
      async function fetchWeather() {
        const apiKey = "65fd2c24a1679d15f7b59502783522f7";
        const { lat, lon } = currentZone;
        const url =
          `https://api.openweathermap.org/data/2.5/weather` +
          `?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=es`;
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Error OpenWeather: ${response.status}`);
          const data = await response.json();
          if (!data.weather?.length || !data.main) throw new Error("Respuesta meteorológica incompleta");

          const { id, description } = data.weather[0];
          currentWeatherCondition = getWeatherCondition(id, description);
          console.log("CLIMA OPENWEATHER:", {
            codigo: data.weather[0].id,
            descripcionOriginal: data.weather[0].description,
            condicionPantalla: currentWeatherCondition,
            nubosidad: data.clouds?.all,
            lluviaUltimaHora: data.rain?.["1h"] ?? 0,
            temperatura: data.main.temp
          });
          document.getElementById("weather").textContent = `${Math.round(data.main.temp)}°C`;
          document.getElementById("city").textContent = "Bogotá";
          updateWeatherIcon();
        } catch (error) {
          console.error("Error obteniendo el clima:", error);
          document.getElementById("weather").textContent = "--";
          document.getElementById("weatherText").textContent = "";
          requestAnimationFrame(fitAllGridText);
        }
      }

      /* Se ejecuta cada minuto y no toca la reproducción si no hubo cambio. */
      function checkDayNightChange() {
        updateWeatherIcon();
        updateWeatherBackground();
      }

      document.getElementById("weatherIconBig").addEventListener("error", (event) => {
        event.currentTarget.style.visibility = "hidden";
        console.error("No se pudo cargar el SVG:", event.currentTarget.getAttribute("src"));
      });
      document.getElementById("weatherIconBig").addEventListener("load", (event) => {
        event.currentTarget.style.visibility = "visible";
      });

      updateClock();
      updateWeatherIcon();
      fitAllGridText();
      if (document.fonts?.ready) document.fonts.ready.then(fitAllGridText);
      window.addEventListener("resize", fitAllGridText);
      if ("ResizeObserver" in window) {
        new ResizeObserver(fitAllGridText).observe(document.querySelector(".container"));
      }

      initializeBackgroundVideos();
      fetchWeather();
      setInterval(updateClock, 1000);
      setInterval(fetchWeather, 10 * 60 * 1000);
      setInterval(checkDayNightChange, 60 * 1000);
    </script>
  </body>
</html>
